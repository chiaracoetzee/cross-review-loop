# Example user config: ~/.config/xreview/config.toml

# Optional path to a trusted environment profile (host rules, sensitivity tags, hooks).
# profile = "~/.config/xreview/profile.toml"

# Optional implementor model family (quorum and dropout verification require another family).
# implementor_family = "claude"

# Optional directory where review runs and ledgers are stored.
# state_dir = "~/.local/state/xreview"

reviewers = [
  # Core: each vendor's strongest model.
  { name = "astra",    harness = "codex",  model = "gpt-6.2-astra",           effort = "high",  family = "gpt" },
  { name = "carbon",   harness = "agy",    model = "gemini-4-carbon-high",                      family = "gemini" },
  { name = "fable",    harness = "claude", model = "claude-fable-5-2",        effort = "high",  family = "claude" },
  # Extras: fast models with high reasoning effort.
  { name = "sol",      harness = "codex",  model = "gpt-6.2-sol",             effort = "xhigh", family = "gpt",    extra = true },
  { name = "hydrogen", harness = "agy",    model = "gemini-4-hydrogen-xhigh",                   family = "gemini", extra = true },
  { name = "sonnet",   harness = "claude", model = "sonnet",                  effort = "max",   family = "claude", extra = true },
]

[policy]
credits = "never"          # stop at plan quota; never spend paid credits
min_families = 2           # refuse to start with fewer distinct model families
soft_round_ceiling = 6     # pause and ask user after this many rounds
shed_extras_at = 0.8       # drop extras on a plan once 80% used (where reported)
timeout_seconds = 1200     # 20 minutes per reviewer turn

[auth]
# claude_token_file = "~/.config/xreview/claude-oauth-token"
# codex_auth_file = "~/.codex/auth.json"
# agy_token_file = "~/.config/xreview/agy-auth/.gemini/antigravity-cli/antigravity-oauth-token"
